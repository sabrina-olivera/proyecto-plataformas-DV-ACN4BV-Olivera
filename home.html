<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

   
</head>

<body>
    <header>
        <h1>Tareas diarias</h1>
    </header>

    <main>
  
        <h1>To-do list</h1>

    <section class="columnas">
    <div class="col">
        <h2>Hacer</h2>
        <div class="input-wrapper">
            <input type="text" id="taskInput" placeholder="Nueva tarea..." maxlength="100" />
            <button type="button" id="btn-agregar">Agregar</button>
        </div>
            <div id="tareas"></div>
    </div>
    <div class="col">
        <h2>En proceso</h2>
        <ul id="lista-en-progreso" class="task-list"></ul>
    </div>
    <div class="col">
        <h2>Terminado</h2>
        <ul id="lista-hecho" class="task-list"></ul>
    </div>
    </section>
        
    </main>

    <footer>
        <p>Esta app te ayudará a enfocarte en tu día a día</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
